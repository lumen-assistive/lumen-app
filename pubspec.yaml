name: lumen_app
description: >-
  Lumen: an offline-first, privacy-by-design assistive app. Onboarding,
  adaptive UI, module host, settings and local encrypted storage.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^13.0.0
  sqflite_sqlcipher: ^2.2.0
  pub_semver: ^2.1.4
  meta: ^1.15.0
  lumen_sdk:
    git:
      url: https://github.com/lumen-assistive/lumen-sdk.git
      ref: v0.1.0
  lumen_core:
    git:
      url: https://github.com/lumen-assistive/lumen-core.git
      ref: v0.1.0
  lumen_plugin_vision:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.3.0
      path: packages/vision
  lumen_plugin_hearing:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.3.0
      path: packages/hearing
  lumen_plugin_safety:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.3.0
      path: packages/safety
  lumen_plugin_family:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.3.0
      path: packages/family
  lumen_plugin_speech:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.3.0
      path: packages/speech
  lumen_plugin_reading:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.3.0
      path: packages/reading
  lumen_plugin_memory:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.3.0
      path: packages/memory
  lumen_plugin_mobility:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.3.0
      path: packages/mobility

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true
